name: landing
description: TRABUILD Landing Page - Flutter Web App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  google_fonts: ^6.1.0
  # 11.0.0+ stops extending IconData, which Flutter 3.44 made a final class.
  # Anything below it fails to compile under the current Flutter SDK.
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.2.1
  visibility_detector: ^0.4.0+2
  http: ^1.1.0
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
